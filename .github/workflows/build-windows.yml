name: Build Eazy POS for Windows

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend API base URL
        required: true
        default: https://eazyerp.co
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'https://eazyerp.co' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve application version
        id: version
        shell: pwsh
        run: |
          $pubspecVersion = (Select-String -Path "pubspec.yaml" -Pattern '^version:\s*([^+\s]+)').Matches.Groups[1].Value
          if (-not $pubspecVersion) { throw "Unable to read version from pubspec.yaml" }
          "name=$pubspecVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer=$pubspecVersion.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Windows application
        shell: pwsh
        run: flutter build windows --release --build-name="${{ steps.version.outputs.name }}" --build-number="${{ github.run_number }}" --dart-define="EAZYERP_BASE_URL=$env:API_BASE_URL" --dart-define=use_arabic=true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Download Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile "windows/installer/vc_redist.x64.exe"
          if (-not (Test-Path "windows/installer/vc_redist.x64.exe")) { throw "Visual C++ runtime download failed" }

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.installer }}" "windows\installer\eazy_pos.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable Windows application
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Eazy-POS-Windows.zip"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Eazy-POS-Installer-${{ steps.version.outputs.installer }}
          path: dist/Eazy-POS-Setup-${{ steps.version.outputs.installer }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Eazy-POS-Windows
          path: Eazy-POS-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Eazy-POS-Setup-${{ steps.version.outputs.installer }}.exe
